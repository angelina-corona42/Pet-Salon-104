<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/registration.css">
    <title>Registration</title>
</head>
<body>
     <header class="site-header"> 
     <div class="logo-area">
         <h2 class="logo">Fluff & Buff</h2>
         <p class="tagline">Pet Salon</p>
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="registration.html">Registration</a>
        <a href="registration.html" class="book-btn">Book Now!</a>
    </nav>
    </header>
    <main>
      <h1>Book an Appointment</h1> 
      <p>Fill out the form below to request a grooming appointment</p> 
      <p>We will confirm your date and time shortly</p>
      <form>
        <fieldset>
            <div class="form-row">

           <div class="form-group">
            <label for="pname">Pet's Name</label>
            <input type="text" id="pname" name="pname" required placeholder="Pet's Name">
           </div>

           <div class="form-group">
            <label for="ptype">Pet Type</label>
            <input type="text" id="ptype" name="ptype" required placeholder="Pet Type">
           </div>

           <div class="form-group">
            <label for="oname">Owner's Name</label>
            <input type="text" id="oname" name="oname" required placeholder="Owner's Name">
           </div>

           <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required placeholder="(555)555-555">
           </div>

           <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="Email Address">
           </div>

            <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required placeholder="Preferred Date">
           </div>

           <div class="form-group">
            <label for="time">Time</label>
            <input type="time" id="time" name="time" required placeholder="Preferred Time">
           </div>

           <div class="form-group">
            <label for="notes">Additional Notes</label>
            <input type="text" id="notes" name="notes" placeholder="Additional Notes (optional)">
           </div>

        </div>
        </fieldset>
        <button type="submit" class="submit-btn">Submit Request</button>
        
      </form>
    </main>
    
<footer>
    <p>&copy; 2026 Fluff & Buff Pet Salon. All rights reserved.</p>
        <div class="footer-links">
            <p class="logo-footer">Fluff & Buff</p>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="registration.html">Registration</a>
        </div>
    </footer>
</body>
</html>
