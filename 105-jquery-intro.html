    <!-- Buttons to trigger jquery actions-->
     <div class="m-5 d-flex flex-wrap gap-3">
        <button id="triggerEventButton" class="btn btn-secondary">Trigger Event</button>

        <!-- Buttons to manipulate the paragraph-->
        
        <button id="hideParagraph" class="btn btn-success">Hide</button>
         <button id="showParagraph" class="btn btn-primary">Show</button>
         <button id="toggleParagraph" class="btn btn-danger">Toggle</button>
         <button id="changeText" class="btn btn-warning">Change Text</button>
         <button id="applyCSS" class="btn btn-info">Apply CSS</button>
         <button id="applyClass" class="btn btn-dark">Apply Class</button>
        
     </div>
    



    <!-- Javascript Files (Needs to be in order, jQuery first and then java) -->
