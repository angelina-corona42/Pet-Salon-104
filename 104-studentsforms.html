<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Student Forms</title>
</head>
<body>
<body class="m-5">
    <h1>Student Forms</h1>
    
    <form class="bg-light p-4 m-3 border rounded">
    
        <div class="input-group mb-3">
            <span class="input-group-text" id="inputGroup-sizing-default">First Name </span>
            <input type="text" class="form-control" placeholder="John" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text" id="inputGroup-sizing-default">Last Name </span>
            <input type="text" class="form-control" placeholder="Smith" aria-describedby="inputGroup-sizing-default">
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text" id="inputGroup-sizing-default">Corhort #</span>
            <input type="text" class="form-control" placeholder="#71" aria-describedby="inputGroup-sizing-default">
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text" id="inputGroup-sizing-default">Email</span>
            <input type="email" class="form-control" placeholder="example@email.com" aria-describedby="inputGroup-sizing-default">
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text" id="inputGroup-sizing-default">Select Class</span>
            <select id="category" class="form-select">
                <option value=""></option>
                <option value="fruits">FDSI Hybrid</option>
                <option value="electronics">FDSI Online</option>
            </select>
        </div>

        <div class="d-flex justify-content-end gap-3">
            <button onclick="register()" class="btn btn-primary" type="submit">Register</button>
            <button onclick="reset()" class="btn btn-secondary" type="reset">Reset</button>
        </div>
    </form>

    <h2>Student List</h2>
        <table class="table p-4 m-4">
            <tr>
                <!-- Header -->
                <th>Name</th>
                <th>Last Name</th>
                <th>Cohort</th>
                <th>Email</th>
                <th>Class</th>

            </tr>
            <tbody id="student">
            
            </tbody>


        </table>





    <script src="/scripts/104-studentsforms.js"></script>
</body>
</html>
