<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Local Storage</title>
</head>
<body>
    <main>
        <h1>Local Storage: Save, Get, and Delete Data. </h1>

            <form class="m-5">
                <div class="input-group mb-3">
                    <label class="input-group-text">Username</label>
                    <input id="username" class="form-control" type="text" placeholder="coro123">
                </div>

                <div class="input-group mb-3">
                    <label class="input-group-text">Name</label>
                    <input id="name" class="form-control" type="text" placeholder="Angelina">
                </div>

                <div class="input-group mb-3">
                    <label class="input-group-text">Age</label>
                    <input id="age" class="form-control" type="number" placeholder="25">
                </div>

                <div class="input-group mb-3">
                    <label class="input-group-text">Email</label>
                    <input id="email" class="form-control" type="email" placeholder="email@mail.com">
                </div>

                <div class="d-flex gap-4 justify-content-end">
                    <button id="saveBtn" class="btn btn-primary">Save</button>
                    <button id="getBtn" class="btn btn-secondary">Get</button>
                    <button id="deleteBtn" class="btn btn-danger">Delete</button>
                </div>

            </form>

            <div class="container mt-5 bg-light p-2">
                <h2>Saved Data</h2>

                <p id="result"></p>
               
            </div>

    </main>

    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script src="/scripts/105-localstorage.js"></script>

</body>
</html>
